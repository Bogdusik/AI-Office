# SearXNG for AI Office: local-only search API used by the research tools.
# The secret key comes from the SEARXNG_SECRET environment variable (root .env), never from this file.
use_default_settings: true

general:
  instance_name: "AI Office search"

server:
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json

ui:
  query_in_title: false
