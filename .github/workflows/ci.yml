name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_office
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_office
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_office -d ai_office"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ai_office:ci@localhost:5432/ai_office
      TEST_DATABASE_URL: postgresql+asyncpg://ai_office:ci@localhost:5432/ai_office_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations and demo seed
        run: |
          alembic upgrade head
          python -m app.seed --demo
      - run: pytest

  frontend:
    name: Frontend (lint, layout, translation and interface checks, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:layout
      - run: npm run check:i18n
      - run: npm run check:ui
      - run: npm run build
